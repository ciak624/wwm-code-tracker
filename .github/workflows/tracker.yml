
name: WWM Code Tracker

on:
  schedule:
    - cron: "0 1,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python tracker.py


      - name: Save database to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f data/codes.json ]; then
            git add data/codes.json data/daily_messages.json

            if ! git diff --cached --quiet; then
              git commit -m "Update redeem code database"
              git push
            else
              echo "Database unchanged."
            fi
          else
            echo "Database file not created."
          fi
